<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E0C">
  <title>Расписание занятий</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <!-- SDK Telegram Mini Apps (вне Telegram просто не сработает, ошибок не даёт) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">

    <!-- Верхняя строка: предупреждение + данные группы -->
    <header class="top">
      <div class="banner">
        <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.2 1.6 21h20.8L12 2.2Zm-1 6.4h2v6.2h-2V8.6Zm0 7.8h2v2.1h-2v-2.1Z"/>
        </svg>
        <span id="bannerText"></span>
      </div>

      <div class="group">
        <div class="group-text">
          <div class="group-id" id="groupId"></div>
          <div class="group-course" id="groupCourse"></div>
        </div>
        <svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 8.5 12 4l10 4.5-10 4.5L2 8.5Z"/>
          <path d="M6 10.7V15c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.3"/>
          <path d="M20.5 9.2v5.3"/>
        </svg>
        <button type="button" class="icon-btn js-edit" title="Редактировать расписание" aria-label="Редактировать расписание">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>
            <path d="M14.5 6.5l3 3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Переключатель недель -->
    <div class="week-toggle" id="weekToggle">
      <button type="button" class="week-btn" data-week="1">1 неделя</button>
      <button type="button" class="week-btn" data-week="2">2 неделя</button>
    </div>

    <!-- Дни недели -->
    <nav class="days" id="days" aria-label="Дни недели"></nav>

    <!-- Список пар -->
    <main class="schedule" id="schedule"></main>

    <a class="credit" href="https://t.me/Byty_z" target="_blank" rel="noopener">By @Byty_z</a>
  </div>

  <!-- Панель редактора (создаётся и заполняется из app.js) -->
  <div class="editor" id="editor" hidden></div>



  <script src="js/data.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
